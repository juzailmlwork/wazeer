<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FWR Recyclers — offline</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: linear-gradient(135deg, #dcfce7 0%, #f0fdf4 100%);
        color: #1e293b;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0;
        padding: 24px;
      }
      .box { text-align: center; max-width: 320px; }
      .mark { width: 72px; margin: 0 auto 20px; display: block; }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { color: #64748b; font-size: 14px; line-height: 1.6; margin: 0 0 20px; }
      button {
        background: #16a34a; color: #fff; border: 0; border-radius: 8px;
        padding: 11px 22px; font-size: 15px; font-family: inherit; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <img class="mark" src="/logo-mark.png" alt="FWR Recyclers" />
      <h1>No connection</h1>
      <p>FWR Recyclers needs the internet to load your records. Check your signal or Wi-Fi and try again.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
