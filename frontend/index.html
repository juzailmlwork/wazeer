         clears the notch when the app is launched from the home screen. -->

    <title>FWR Recyclers</title>

    <meta name="description" content="Recycling plant management — buying, selling, stock, expenses and reports." />

    <link rel="icon" href="/icons/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- iOS ignores the manifest; these are its equivalents. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="FWR" />
  </head>
